{{- if .Values.inference.enabled }}
# templates/inference-service.yaml
#
# Kubernetes Service exposing the inference API.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.projectName }}-inference-svc
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.projectName }}-inference
  ports:
    - name: http
      port: {{ .Values.inference.servicePort }}
      targetPort: {{ .Values.inference.containerPort }}
  type: {{ .Values.inference.serviceType }}
{{- end }}
