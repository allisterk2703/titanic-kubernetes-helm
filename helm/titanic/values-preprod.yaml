# values-preprod.yaml - pre-production overlay, applied on top of values.yaml:
#   make helm-deploy-inference HELM_ENV=preprod
# Only the keys that differ from values.yaml are listed here.

projectName: titanic-kubernetes-helm
namespace: titanic-kubernetes-helm-preprod-namespace

training:
  # Triggered on demand by make helm-run-training
  enabled: false

inference:
  enabled: true

  # A single replica is enough to validate a version
  replicaCount: 1

  # Local image, no registry: latest + Never. '-arm64' is the deploy arch
  # (the OrbStack node), independent of the Makefile build-time ARCH.
  image: titanic-kubernetes-helm-image-inference-arm64
  tag: latest
  imagePullPolicy: Never

  containerPort: 8080
  serviceType: LoadBalancer
  servicePort: 8080
