[project]
name = "titanic-kubernetes"
version = "0.1.0"
description = "Titanic survival prediction: training pipeline and FastAPI inference service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{name = "Allister Kohn", email = "allister.kohn@gmail.com"}]
dependencies = [
    "pandas",
    "scikit-learn",
    "mlflow",
    "fastapi",
    "pydantic",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "isort",
    "black[jupyter]",
    "ruff",
    "pre-commit",
    "pytest",
]

[project.scripts]
titanic-train = "titanic.cli:main"
titanic-serve = "titanic.api.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titanic"]

[tool.black]
line-length = 120
target-version = ["py313"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
exclude = ["setup.py", "*.ipynb"]

[tool.ruff.lint]
# Pinned explicitly so that a new ruff release cannot widen the rule set and
# break CI: E4/E7/E9 + F are ruff's historical defaults, E501 adds line length.
select = ["E4", "E7", "E9", "F", "E501"]
ignore = ["E731"]
